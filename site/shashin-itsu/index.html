  // 同じタブで一度開けていれば、保存した鍵で自動的に開く
  try {
    var saved = sessionStorage.getItem(K);
    if (saved) { var s = JSON.parse(saved); if (s.salt === SALT) importRaw(b64(s.key)).then(open).catch(function () { sessionStorage.removeItem(K); }); }
  } catch (e) {}
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('b'), err = document.getElementById('e');
    btn.disabled = true; btn.textContent = '確認中…'; err.textContent = '';
    var pw = new TextEncoder().encode(document.getElementById('p').value);
    crypto.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    }).then(function (key) {
      return crypto.subtle.exportKey('raw', key).then(function (raw) {
        return open(key).then(function () {
          try { sessionStorage.setItem(K, JSON.stringify({ salt: SALT, key: btoa(String.fromCharCode.apply(null, new Uint8Array(raw))) })); } catch (e) {}
        });
      });
    }).catch(function () {
      btn.disabled = false; btn.textContent = '開く'; err.textContent = 'パスワードが違います';
    });
  });
})();
</script>
