      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    }).then(function (key) {
      return crypto.subtle.exportKey('raw', key).then(function (raw) {
        return open(key).then(function () {
          try { sessionStorage.setItem(K, JSON.stringify({ salt: SALT, key: btoa(String.fromCharCode.apply(null, new Uint8Array(raw))) })); } catch (e) {}
        });
      });
    }).catch(function () {
      btn.disabled = false; btn.textContent = '開く'; err.textContent = 'パスワードが違います';
    });
  });
})();
</script>
