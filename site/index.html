  button { font:inherit; font-weight:700; padding:12px; border:0; border-radius:12px; background:var(--accent); color:#fff; }
  .err { color:#d64532; font-size:.9rem; min-height:1.4em; margin:0; }
  .muted { color:var(--muted); font-size:.85rem; margin:0; }
